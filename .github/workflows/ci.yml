name: CI
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff pytest numpy scipy pandas matplotlib rdkit
      - run: ruff check .
      - name: Run tests per day folder (avoids tool.py module name clashes)
        run: |
          for d in days/*/; do
            pytest -q --no-header "$d" || [ $? -eq 5 ] || exit 1
          done
